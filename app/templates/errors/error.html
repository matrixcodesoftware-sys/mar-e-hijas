{% extends ("base.html" if current_user.is_authenticated else "errors/simple.html") %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="error-pagina">
    <div>
        <div class="error-pagina__codigo">{{ codigo }}</div>
        <h1>{{ titulo }}</h1>
        <p class="muted">{{ mensaje }}</p>
        <a class="btn btn--primario mt-2" href="{{ url_for('auth.raiz') }}">Volver al inicio</a>
    </div>
</div>
{% endblock %}
